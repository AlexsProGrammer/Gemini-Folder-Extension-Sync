services:
  gemini-sync-backend:
    build:
      context: .
    container_name: gemini-sync-backend
    # NOTE: the container runs as user "node" (uid/gid 1000). The host ./data
    # directory is a bind mount, so it must be writable by uid 1000 — otherwise
    # SQLite fails with "unable to open database file" (SQLITE_CANTOPEN).
    ports:
      - "127.0.0.1:${PORT:-3000}:${PORT:-3000}"
    volumes:
      - ./data:/app/data
    # Pass the whole .env file through so API_KEY / API_KEY_<NAME> /
    # API_KEY_<NAME>_ACCOUNTS variables all reach the container (the backend
    # validates them at startup; see src/common/guards/api-key.registry.ts).
    env_file:
      - .env
    environment:
      PORT: ${PORT:-3000}
      DB_PATH: /app/data/sync.db
      LOG_LEVEL: ${LOG_LEVEL:-info}
    restart: unless-stopped
